[test]
# A bare `bun test` would otherwise sweep tests/*.spec.ts as well — those are
# Playwright suites run by `bun run test`, and they cannot execute under the bun
# test runner. Rooting here keeps `bun test` to the unit suites.
root = "unit"

coverage = true
coverageSkipTestFiles = true

# vitest gated coverage on an allowlist of three pure helpers at 90%. bun has no
# allowlist — it reports every file the run loads — so the equivalent is stated
# as its inverse: exclude what the suites merely pull in as a dependency, and
# hold everything that remains to 90%.
#
# NOTE: bun applies this threshold PER FILE, not to the "All files" total, and
# only the scalar form is honoured (a `{ line = …, function = … }` table parses
# but is silently ignored — a gate that cannot fail). Both were verified by
# setting a deliberately failing value and checking the exit code.
coverageThreshold = 0.90

# Loaded by the suites but not their target: I/O shims and DB adapters (covered
# end-to-end by `bun run qa:all` instead), the FSRS route handler, and repos
# exercised indirectly through it. Dropping an entry means that file must reach
# 90% — which is the point: it should be a deliberate choice, not a drift.
coveragePathIgnorePatterns = [
  # Test scaffolding, not product code. coverageSkipTestFiles only skips files
  # matching the test globs, and support modules deliberately do not.
  # Must be a glob — a bare "unit/support/" silently matches nothing.
  "unit/support/**",
  "app/db.ts",
  # Replaced wholesale by unit/support/testMocks.ts (mock.module), so the real
  # function never runs under the unit suites: 0% funcs / 50% lines on bun
  # 1.4.2, which fails the per-file gate locally. Covered by qa:all.
  "app/getFSRSNotesCollection.ts",
  "app/fsrs.ts",
  "app/fsrsNotesD1Collection.ts",
  "app/getRoadmapGoalsCollection.ts",
  "app/getWatchStatsStore.ts",
  # Reached only because app/fsrs.ts now calls authUserOrNull() for the
  # per-user review order — the auth stack, not anything a unit suite targets.
  "app/signInEmail.tsx",
  "auth.ts",
  "lib/app-locale.server.ts",
  "app/lib/heatmap-aggregation.ts",
  "app/lib/heatmap-cache.ts",
  "app/lib/notesAdmin.ts",
  "lib/constants.ts",
  "lib/d1/index.ts",
  "lib/d1/testDb.ts",
  "lib/membership.ts",
  "lib/migrate/mappers.ts",
  "lib/migrate/runMigration.ts",
  "lib/rateLimit.ts",
  "lib/repos/d1Repos.ts",
  "lib/repos/fsrsNotesD1.ts",
  # Read materials' storage: a Mongo branch beside each D1 one (GridFS, the
  # frozen rollback copy). Its D1 side runs in unit/read-words-backfill.test.ts.
  "lib/getReadMaterialsCollection.ts",
  # The swipe core's React/DOM glue (contexts, pointer and touch wiring,
  # timers, rAF). Its logic is in pure files held to 90% here
  # (swipe-physics, swipe-machine, swipe-feel); the glue needs a browser and is
  # covered by qa-words' phone checks (light and heavy, both swipes).
  "lib/words/swipe-core.tsx",
  # A React hook over lib/page-dirty.ts's registry (held to 90% here); it is
  # only loaded because swipe-core.tsx calls it.
  "lib/use-leave-guard.ts",
  # The chat's + menu components (React glue: hooks, effects, DOM listeners).
  # Their logic is in attach.ts (held to 90% here); unit/chat-attach-tree.test.ts
  # renders the markup only, and debug-chat-bar-qa.mjs drives them in a browser.
  "packages/debug-chat/src/AttachMenu.tsx",
  # A message's details popover (React glue: popover, layout effect, events).
  # Its voice logic is in voice-heard.ts (held to 90% here); the markup is
  # rendered in unit/voice-heard.test.tsx, the clicks in a browser.
  "packages/debug-chat/src/MessageDetails.tsx",
  # rgui, the vendored component library (git subtree of snomiao/rgui,
  # docs/rgui.md). Its own suites live upstream (packages/rgui/src/**/*.test.ts,
  # run there with its bunfig); ours only load these files because our gantt
  # module calls a few of their functions. Gating them here would hold someone
  # else's code to our per-file 90% and break every subtree pull. Our module,
  # packages/rgui/src/gantt/, is NOT ignored and stays at 100%
  # (unit/rgui-gantt.test.ts, unit/gantt-view.test.ts).
  "packages/rgui/src/core/**",
  "packages/rgui/src/lane/**",
]
