# gitleaks config. Extends the maintained default ruleset rather than replacing it.
[extend]
useDefault = true

[allowlist]
description = "Build output and local agent logs are untracked; scanning them only reports noise."
paths = [
  '''^\.next/''',
  '''^\.open-next/''',
  '''^node_modules/''',
  '''^\.agent-yes/''',
  '''^bun\.lock$''',
]
# A deliberately fake Stripe-shaped key: unit/security.test.ts checks that the
# public-dir hygiene scan flags one. Committed in 3346e79, so it must stay
# allowed for the history scan; the test now builds it at runtime.
# RFC 6455's sample Sec-WebSocket-Key ("the sample nonce" in base64), sent by a
# handshake test in 987e0972. CI's checkout fetches every branch, so one pushed
# copy fails the scan on every PR; it is public and never a secret.
regexes = [
  # The HKDF salt and info labels of the recordings' at-rest key
  # (lib/recordings.ts, a5d76125, #946): `RECORDINGS_KEY_SALT = "lianki/recordings"`
  # is read as a generic API key because of the name. Labels, not secrets;
  # pushed history, so they stay allowed.
  '''^lianki/recordings(/at-rest/v\d+)?$''',
  '''sk_live_abcdefghijklmnop1234''',
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  # A fake cloudflared run token ({"a":"RUN-TOKEN-SECRET"} in base64), the
  # fixture of unit/cf-tunnel.test.ts in 51467306 (#399): pushed history, so
  # it stays allowed for the scan of every branch.
  '''eyJhIjoiUlVOLVRPS0VOLVNFQ1JFVCJ9''',
  # UI string keys of the reader's grammar labels (lib/read/form-tags.ts in
  # ba465f1f, #532: `key: "person1Singular"`), read as a generic API key.
  # Pushed history; the field is named `piece` since. (Matched against the
  # secret gitleaks captured, the string itself.)
  '''^person[123]Singular$''',
  # The fake API key of unit/byok.test.ts (#593), the value the test proves
  # never reaches our origin; pushed history, so it stays allowed.
  '''sk-test-SECRET-never-leaves-0000''',
  # The fake secrets of unit/stall-watch.test.ts (#872), the strings its
  # redaction tests prove are hidden; pushed history (c114fe19), so they stay
  # allowed. The test now builds them at runtime.
  '''abcdefghijklmnop1234''',
  '''AKIAABCDEFGHIJKLMNOP''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0''',
  '''abc123def456''',
  '''hunter2hunter2''',
]
