name: Nightly QA

# The full integration gate, `bun run qa:all` (OpenNext build → wrangler dev on
# local D1 → API + UI + sync + userscript suites), plus the extension smoke
# test, against main once a night. It used to run on every push and PR, and
# main's deploy waited ~4 min for it (owner, 2026-10-31: run it nightly). The
# merge queue runs the same qa:all on every PR before it lands (ci.yml, `qa`),
# and pre-push runs only the suites a change reaches; this catches what slipped
# past both, and drift in the runner image.
on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

concurrency:
  group: nightly-qa
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # The same build + three shards as the merge queue (qa-sharded.yml), plus the
  # MV3 extension smoke test in shard 1. Runs on main, so the .next/cache it
  # saves is the one merge-queue runs restore.
  qa:
    name: qa
    uses: ./.github/workflows/qa-sharded.yml
    with:
      ext-smoke: true

  alert:
    name: "Alert #lianki when nightly QA fails"
    needs: qa
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: "Alert #lianki"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/ci/slack-alert.sh ":red_circle: nightly qa:all failed on main at ${GITHUB_SHA::7}: ${RUN_URL}"
