name: Full QA

# The full set — every qa:all suite (build + three shards, qa-sharded.yml) and
# the extension smoke test — on main. Never on a timer (owner, 2026-11-10: he
# can be away for days; with no merges nothing runs). It starts:
# - from merges, through full-qa-trigger.yml: once merges have been quiet
#   FULL_QA_QUIET_MIN minutes (debounce), at once when a QA_FULL path changed
#   or FULL_QA_MAX_MERGES merges piled up, and at the latest when the oldest
#   untested merge has waited FULL_QA_MAX_WAIT_H hours (throttle);
# - from deploy-worker.yml while deploys are held;
# - by hand: `gh workflow run nightly-qa.yml -R snolab/lianki`.
# The merge queue runs qa:all too (ci.yml); this catches what a combination
# of merges breaks after the queue, and drift in the runner image. (File name kept from when it ran once a night on a cron.)
#
on:
  workflow_dispatch:

# A run in progress finishes; a newer start waits behind it (and replaces any
# other waiting one), so the newest main is always tested next.
concurrency:
  group: nightly-qa
  cancel-in-progress: false

jobs:
  # Runs on main, so the .next/cache it saves is the one merge-queue runs restore.
  qa:
    name: qa
    uses: ./.github/workflows/qa-sharded.yml
    with:
      ext-smoke: true

  # A green run after a red one lifts the deploy hold and deploys prod (the
  # release branch; this run tested main). deploy-worker cannot hear it through workflow_run: this run was
  # started with the workflow token (by the trigger or the hold), and such runs
  # start no workflow_run. A workflow_dispatch from here does start one.
  on-green:
    name: "On green: lift the deploy hold"
    needs: qa
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # read Full QA's runs; start deploy-worker
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun # pinned, cached, retried
      - id: lifts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/full-qa.ts lifts "$GITHUB_RUN_ID"
      - name: Deploy what this run tested
        if: steps.lifts.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-worker.yml -R "$GITHUB_REPOSITORY" --ref prod \
            -f lifted_by="$GITHUB_RUN_ID" -f sha="$GITHUB_SHA"
          echo "::notice title=Deploy hold lifted::green at ${GITHUB_SHA::7}; started Deploy Worker for prod"

  on-red:
    name: "On red: alert + revert PR"
    needs: qa
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the revert needs the commits since the last green run
      - uses: ./.github/actions/setup-bun # pinned, cached, retried
      - name: Revert PR
        id: revert
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/full-qa.ts revert "$GITHUB_SHA"
      - name: "Alert #lianki"
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ steps.revert.outputs.pr }}
        run: |
          msg=":red_circle: full QA failed on main at ${GITHUB_SHA::7}, deploys are held until it is green: ${RUN_URL}"
          if [ -n "$PR" ]; then msg="$msg — revert PR: $PR"; fi
          bash scripts/ci/slack-alert.sh "$msg"
