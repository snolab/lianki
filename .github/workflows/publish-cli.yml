name: Publish CLI

# Publishes packages/lianki-cli (npm package `lianki`) on `lianki-cli-v*` tags.
#
# Auth: an npm automation/granular token in the NPM_TOKEN secret (bypasses 2FA).
# We would prefer tokenless OIDC Trusted Publishing, but npm binds a package's
# trusted-publisher owner to the npm account's own GitHub identity (`snomiao`),
# while this repo lives under the `snolab` org — so the OIDC exchange fails
# ("package not found"). Until that org-linkage is resolved, publish via token.
# `--provenance` still uses the GitHub OIDC id-token to sign a sigstore
# provenance attestation, independent of the publish credential.
#
# The only way `lianki` reaches npm: push a tag `lianki-cli-v<version>` that
# matches packages/lianki-cli/package.json, on a commit already on main. No
# manual dispatch, and nobody runs `npm publish` from a laptop.
on:
  push:
    tags:
      - "lianki-cli-v*"

permissions:
  contents: read
  id-token: write # for --provenance signing (sigstore)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lianki-cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: |
          npm install -g npm@latest
          hash -r
          echo "node: $(node -v)  npm: $(npm -v)"
      - name: Verify the tag is on main and matches the version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#lianki-cli-v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::package.json version ($pkg_version) != tag ($tag_version)"
            exit 1
          fi
      - name: Files in the tarball
        run: npm pack --dry-run
      # From the packed tarball in an empty folder, as `npx lianki` would run
      # it: no build step, no workspace, a fresh config dir (so: not signed in).
      - name: Smoke test the tarball under Node
        run: |
          tgz="$PWD/$(npm pack --silent)"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null && npm install --no-audit --no-fund "$tgz"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/smoke-config"
          npx lianki --help
          [ "$(npx lianki --version)" = "${GITHUB_REF_NAME#lianki-cli-v}" ]
          set +e; npx lianki next --json </dev/null; code=$?; set -e
          [ "$code" = 2 ] || { echo "::error::expected exit 2 (not signed in), got $code"; exit 1; }
          rm "$tgz"
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
