name: CI

# The full gate, where the pre-push hook runs only what a change can reach
# (scripts/gate/affected.ts; owner, 2026-11-08: "unchanged areas are not
# re-tested on pre-push; the full set stays in CI"):
#
# - `checks` — OXC lint + format check, typecheck, and unit tests: on a PR only
#   the ones the change reaches, in parallel; in every merge group and on every
#   push to main the WHOLE unit suite with its coverage gate (~55 s).
# - `qa` — qa:all (OpenNext build → wrangler dev on local D1 → suites), built
#   once and run in three parallel shards (qa-sharded.yml), in the merge queue
#   only (and on a manual dispatch): the suites the group's changes reach plus
#   a smoke set (`qa-plan`), or every suite when a core path changed. The full
#   set runs after merges on main (nightly-qa.yml). A PR does not wait for it and
#   main's deploy does not either (owner, 2026-10-31). Blocking (QA_BLOCKING
#   below).
# - `gate` — named `Typecheck + unit`, the one required check: green when
#   `checks` passed and `qa` (its build and every shard) passed or was skipped
#   (it is skipped outside the merge queue). It is the aggregator the shards
#   report through, so branch protection is unchanged.
#
# QA_BLOCKING "false" turns a qa failure into a warning on the gate. It was
# "false" while WORDS' Settings-sheet check failed in CI (2026-11-08,
# /infra/words-ci-fix); keep it "true" unless a CI-only failure needs the same.
#
# deploy-worker.yml runs on this workflow's success on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue (docs/shipping.md): each queued PR is tested on top of
  # main plus the PRs ahead of it, so two green PRs cannot merge red together.
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint + typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      # gitleaks-action@v2 requires a paid licence for organisation accounts, so
      # run the upstream binary directly — same tool, no licence gate.
      # Download to a FILE, then extract. Piping curl into tar reports a GitHub
      # outage as "tar: Error is not recoverable", which hides the cause: the
      # run that prompted this said exactly that, and the real error was
      # `curl: (22) ... 500` from the release CDN. The binary is cached per
      # version, and a miss downloads with backoff (scripts/ci/fetch.sh), because
      # one hiccup fetching a third-party binary should not turn main red
      # (docs/shipping.md, "Flaky tool downloads").
      - name: Restore gitleaks from cache
        id: gitleaks-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/gitleaks-bin
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Download gitleaks (with retries)
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/ci/fetch.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$RUNNER_TEMP/gitleaks.tar.gz"
          mkdir -p ~/.cache/gitleaks-bin
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C ~/.cache/gitleaks-bin gitleaks
      - name: Secret scan (gitleaks)
        run: ~/.cache/gitleaks-bin/gitleaks git . --no-banner --redact -v
      # No Node toolchain here: the unit suites run on `bun test`, and bun
      # implements node:sqlite natively (no --experimental-sqlite flag). The
      # integration job still needs Node, because wrangler requires it.
      # Pinned Bun, cached, retried: .github/actions/setup-bun.
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      # 脆弱性対策 ② (docs/security-measures.md): nothing in public/ may be a
      # secret, an env file, a key or a server source map.
      - name: Public directory hygiene
        run: bun scripts/security/check-public-dir.ts public
      - name: Lint + format (oxlint, oxfmt --check)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      # A PR runs only the unit tests its change reaches, in parallel workers
      # (scripts/gate/affected.ts; the full suite with coverage when a
      # UNIT_FULL path changed). The merge queue and main run the whole suite
      # with its coverage gate, so nothing lands without it (docs/shipping.md,
      # "Unit tests on a PR").
      - name: Unit tests (affected, parallel)
        if: github.event_name == 'pull_request'
        env:
          LIANKI_GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/gate/affected.ts unit --parallel
      - name: Unit tests + coverage
        if: github.event_name != 'pull_request'
        run: bun run test:unit -- --coverage
      # main is red after a merge (e.g. two PRs green on their own, broken
      # together): say so in #lianki. Needs SLACK_WEBHOOK_URL (an incoming
      # webhook for #lianki) as a repo secret; without it this only warns.
      - name: "Alert #lianki when main is red"
        if: failure() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/ci/slack-alert.sh ":red_circle: main is red at ${GITHUB_SHA::7} — Lint + typecheck + unit failed, so the deploy is held: ${RUN_URL}"

  # Which qa suites the merge group needs (docs/shipping.md, "Affected-only in
  # the merge queue"): the ones its changes reach since merge_group.base_sha,
  # plus the smoke set (API, UI, SIGN OUT); the full set when a core path
  # changed or the graph cannot be built, and on a manual dispatch. The full
  # set also runs after merges on main (nightly-qa.yml).
  qa-plan:
    name: qa plan
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff needs merge_group.base_sha
      - uses: ./.github/actions/setup-bun # pinned, cached, retried
      # No install: the selector needs only bun and git.
      - id: plan
        env:
          LIANKI_GATE_BASE: ${{ github.event.merge_group.base_sha }}
          LIANKI_GATE_FULL: ${{ github.event_name == 'merge_group' && '0' || '1' }}
        run: bun scripts/gate/affected.ts ci-qa >> "$GITHUB_OUTPUT"

  # qa:all on the planned suites, split over a build job and three parallel
  # shards (qa-sharded.yml; docs/shipping.md, "qa:all in shards"). Was one
  # ~12.5 min job of every suite until 2026-11-10.
  qa:
    name: qa
    needs: qa-plan
    uses: ./.github/workflows/qa-sharded.yml
    with:
      suites: ${{ needs.qa-plan.outputs.suites }}

  # The required check. Its name is what branch protection names, so it stays
  # `Typecheck + unit` though it now stands for both jobs above.
  gate:
    name: Typecheck + unit
    needs: [checks, qa-plan, qa]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checks passed; qa passed or skipped (blocking only when QA_BLOCKING)
        env:
          CHECKS: ${{ needs.checks.result }}
          QA: ${{ needs.qa-plan.result != 'success' && needs.qa-plan.result != 'skipped' && 'failure' || needs.qa.result }}
          QA_BLOCKING: "true"
        run: |
          echo "checks: $CHECKS, qa: $QA, qa blocking: $QA_BLOCKING"
          [ "$CHECKS" = "success" ] || exit 1
          if [ "$QA" != "success" ] && [ "$QA" != "skipped" ]; then
            if [ "$QA_BLOCKING" = "true" ]; then exit 1; fi
            echo "::warning title=qa:all (merge queue) $QA::report-only (QA_BLOCKING false); see the qa job's log"
          fi
