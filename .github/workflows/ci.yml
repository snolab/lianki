name: CI

# The full gate, where the pre-push hook runs only what a change can reach
# (scripts/gate/affected.ts; owner, 2026-11-08: "unchanged areas are not
# re-tested on pre-push; the full set stays in CI"):
#
# - `checks` — OXC lint + format check, typecheck, the WHOLE unit suite with its
#   coverage gate. Every PR, every merge group, every push to main (~20 s).
# - `qa` — the whole `bun run qa:all` (OpenNext build → wrangler dev on local
#   D1 → every suite), in the merge queue only; also nightly on main
#   (nightly-qa.yml). A PR does not wait for it and main's deploy does not
#   either (owner, 2026-10-31). Blocking (QA_BLOCKING below).
# - `gate` — named `Typecheck + unit`, the one required check: green when
#   `checks` passed and `qa` passed or was skipped (it is skipped outside the
#   merge queue). Branch protection is unchanged.
#
# QA_BLOCKING "false" turns a qa failure into a warning on the gate. It was
# "false" while WORDS' Settings-sheet check failed in CI (2026-11-08,
# /infra/words-ci-fix); keep it "true" unless a CI-only failure needs the same.
#
# deploy-worker.yml runs on this workflow's success on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue (docs/shipping.md): each queued PR is tested on top of
  # main plus the PRs ahead of it, so two green PRs cannot merge red together.
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint + typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      # gitleaks-action@v2 requires a paid licence for organisation accounts, so
      # run the upstream binary directly — same tool, no licence gate.
      # Download to a FILE, then extract. Piping curl into tar reports a GitHub
      # outage as "tar: Error is not recoverable", which hides the cause: the
      # run that prompted this said exactly that, and the real error was
      # `curl: (22) ... 500` from the release CDN. Retries because one hiccup
      # fetching a third-party binary should not turn main red.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact
        env:
          GITLEAKS_VERSION: 8.28.0
      # No Node toolchain here: the unit suites run on `bun test`, and bun
      # implements node:sqlite natively (no --experimental-sqlite flag). The
      # integration job still needs Node, because wrangler requires it.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # 脆弱性対策 ② (docs/security-measures.md): nothing in public/ may be a
      # secret, an env file, a key or a server source map.
      - name: Public directory hygiene
        run: bun scripts/security/check-public-dir.ts public
      - name: Lint + format (oxlint, oxfmt --check)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests + coverage
        run: bun run test:unit -- --coverage
      # main is red after a merge (e.g. two PRs green on their own, broken
      # together): say so in #lianki. Needs SLACK_WEBHOOK_URL (an incoming
      # webhook for #lianki) as a repo secret; without it this only warns.
      - name: "Alert #lianki when main is red"
        if: failure() && github.event_name == 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/ci/slack-alert.sh ":red_circle: main is red at ${GITHUB_SHA::7} — Lint + typecheck + unit failed, so the deploy is held: ${RUN_URL}"

  # The whole qa:all, merge queue only. Same container and steps as nightly-qa.yml
  # (see the reasons there: browsers baked into the image, Node 24, HOME=/root
  # for Firefox). ~6-7 min on a runner.
  qa:
    name: qa:all (merge queue)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y unzip xvfb
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: qa:all
        run: bun run qa:all
        env:
          HOME: /root

  # The required check. Its name is what branch protection names, so it stays
  # `Typecheck + unit` though it now stands for both jobs above.
  gate:
    name: Typecheck + unit
    needs: [checks, qa]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checks passed; qa passed or skipped (blocking only when QA_BLOCKING)
        env:
          CHECKS: ${{ needs.checks.result }}
          QA: ${{ needs.qa.result }}
          QA_BLOCKING: "true"
        run: |
          echo "checks: $CHECKS, qa: $QA, qa blocking: $QA_BLOCKING"
          [ "$CHECKS" = "success" ] || exit 1
          if [ "$QA" != "success" ] && [ "$QA" != "skipped" ]; then
            if [ "$QA_BLOCKING" = "true" ]; then exit 1; fi
            echo "::warning title=qa:all (merge queue) $QA::report-only (QA_BLOCKING false); see the qa job's log"
          fi
