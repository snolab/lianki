[package]
name = "lianki-desktop"
version = "0.1.0"
description = "Lianki desktop shell — a native window around https://lianki.com"
authors = ["snolab"]
license = "MIT"
repository = "https://github.com/snolab/lianki"
edition = "2024"
rust-version = "1.90"

[lib]
name = "lianki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
url = "2"
