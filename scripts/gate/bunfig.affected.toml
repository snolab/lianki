# bunfig for the pre-push gate's affected-only unit run (scripts/gate/affected.ts).
# Same as ../../bunfig.toml minus coverage: the per-file 90% threshold cannot
# hold on a subset of the suites (a file is only partly exercised by the tests
# that were picked), so the coverage gate runs on the full suite only — in CI on
# merge groups and main, and whenever the selector falls back to the full suite.
# The globals-guard preload must stay (#1085): besides failing a run that leaves a global behind, it
# sets the fake owner hosts the suites read; without it polish-readback and tunnel-headers fail on
# every push that selects them. react-dom-env goes first.
[test]
root = "unit"
coverage = false
# The full suite's guard (../../bunfig.toml): globals a file stubs are put back
# before the next file. Without it a subset leaked them (2026-11-15: live-view's
# signature checks failed only in the affected run).
# Without --parallel the picked files share one process: react-dom/client's
# one-time `input` event check must see a DOM (unit/support/react-dom-env.ts).
preload = ["./unit/support/react-dom-env.ts", "./unit/support/globals-guard.ts"]
