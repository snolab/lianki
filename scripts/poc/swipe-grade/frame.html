<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swipe deck</title>
  <style>
    :root { color-scheme: dark; --bg: #111a2e; --fg: #e8edf7; --mute: #8a96b0; --line: #243049;
            --again: #ef4444; --hard: #f59e0b; --good: #22c55e; --easy: #3b82f6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    .stage { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 10px 12px; gap: 10px; user-select: none; -webkit-user-select: none; }

    /* ── grade meter: far left Again, near left Hard, near right Good, far right Easy ── */
    .meter { position: relative; height: 34px; border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .meter span { display: grid; place-items: center; opacity: .45; transition: opacity .12s, background .12s; }
    .meter .again { color: var(--again); } .meter .hard { color: var(--hard); } .meter .good { color: var(--good); } .meter .easy { color: var(--easy); }
    .meter span.lit { opacity: 1; background: rgba(255,255,255,.08); }
    .meter .marker { position: absolute; top: 4px; bottom: 4px; width: 3px; left: 50%; background: var(--fg); border-radius: 2px; translate: -50% 0; opacity: .5; }
    .meter .mid { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--line); }

    /* ── deck ── */
    .deck { position: relative; display: grid; place-items: center; touch-action: none; }
    .card { position: absolute; width: 100%; max-width: 560px; aspect-ratio: 9 / 14; max-height: 100%; border-radius: 16px; overflow: hidden; background: #000;
            box-shadow: 0 16px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08); will-change: transform; display: grid; grid-template-rows: 1fr auto; }
    .card .video { position: relative; background: #000; }
    .card .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .card .overlay { position: absolute; inset: 0; cursor: grab; }                 /* owns every pointer; tap = play/pause */
    .card.free .overlay { pointer-events: none; }                                   /* "controls" mode: let touches reach YouTube */
    .card .cap { padding: 10px 12px; font-size: 13px; color: var(--mute); background: #0b1220; display: flex; justify-content: space-between; gap: 8px; }
    .card .cap b { color: var(--fg); }
    .card.under { transform: scale(.94) translateY(16px); opacity: .5; pointer-events: none; }
    .card.fly { transition: transform .3s cubic-bezier(.2,.7,.3,1), opacity .3s; opacity: 0; }
    .card.snap { transition: transform .22s cubic-bezier(.2,.7,.3,1); }
    .stamp { position: absolute; top: 14px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 10px; font-weight: 800; font-size: 22px; letter-spacing: .08em; opacity: 0; pointer-events: none; background: rgba(0,0,0,.35); }
    .stamp.again, .stamp.hard { left: 14px; transform: rotate(-8deg); }
    .stamp.good, .stamp.easy { right: 14px; transform: rotate(8deg); }
    .stamp.again { color: var(--again); } .stamp.hard { color: var(--hard); } .stamp.good { color: var(--good); } .stamp.easy { color: var(--easy); }
    .stamp.next, .stamp.undo { left: 50%; translate: -50% 0; transform: none; color: var(--fg); }
    .stamp.next { top: auto; bottom: 54px; } .stamp.undo { top: 14px; }

    .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); flex-wrap: wrap; }
    .tally span { margin-left: 8px; } .tally .again { color: var(--again); } .tally .hard { color: var(--hard); } .tally .good { color: var(--good); } .tally .easy { color: var(--easy); }
    .foot button { font: inherit; font-size: 12px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; touch-action: manipulation; }
    .foot button[aria-pressed="true"] { border-color: var(--easy); color: var(--easy); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="meter" id="meter">
      <span class="again" data-z="again">AGAIN</span><span class="hard" data-z="hard">HARD</span>
      <span class="good" data-z="good">GOOD</span><span class="easy" data-z="easy">EASY</span>
      <i class="mid"></i><i class="marker" id="marker"></i>
    </div>
    <div class="deck" id="deck"></div>
    <div class="foot">
      <span id="status">loading</span>
      <span class="tally" id="tally"></span>
      <button id="free" type="button" aria-pressed="false">YouTube controls</button>
    </div>
  </div>

  <script>
    // ── model ────────────────────────────────────────────────────────────
    // Horizontal: grade by distance. |dx| < DEAD -> nothing. DEAD..FAR -> near zone
    // (Hard on the left, Good on the right). >= FAR -> far zone (Again / Easy).
    // Vertical: up = next (skip), down = undo the last action.
    const DEAD = 36, FAR = 150;
    const GRADES = {
      again: { pattern: [40, 60, 40] },
      hard:  { pattern: [80] },
      good:  { pattern: [30] },
      easy:  { pattern: [20, 40, 20, 40, 20] },
    };
    const NAV = { next: { pattern: [15] }, undo: { pattern: [15, 40, 15] } };
    const TICK = [12];
    const KEYS = { "1": "again", "2": "hard", "3": "good", "4": "easy" };
    // ?v=id1,id2 overrides the playlist.
    const qs = new URLSearchParams(location.search).get("v");
    const VIDEOS = (qs ? qs.split(",") : ["jNQXAC9IVRw", "dQw4w9WgXcQ", "9bZkp7q19f0", "kJQP7kiw5Fk"]).map((s) => s.trim()).filter(Boolean);

    const canVibrate = typeof navigator.vibrate === "function";
    const post = (m) => parent.postMessage(Object.assign({ src: "swipe-grade" }, m), "*");
    function vibrate(pattern) {
      try { return canVibrate && navigator.vibrate(pattern); } catch { return false; }
    }
    function zoneFor(dx) {
      const a = Math.abs(dx);
      if (a < DEAD) return null;
      if (dx < 0) return a >= FAR ? "again" : "hard";
      return a >= FAR ? "easy" : "good";
    }

    // ── state ────────────────────────────────────────────────────────────
    const deck = document.getElementById("deck"), meter = document.getElementById("meter"), marker = document.getElementById("marker");
    const status = document.getElementById("status"), tallyEl = document.getElementById("tally"), freeBtn = document.getElementById("free");
    const tally = { again: 0, hard: 0, good: 0, easy: 0 };
    const history = [];             // [{ index, grade|null }] so a down-swipe can undo
    let index = 0, cur = null, under = null, players = new Map(), ytReady = false, free = false;
    const renderTally = () => tallyEl.innerHTML = Object.entries(tally).map(([g, n]) => "<span class=\"" + g + "\">" + g + " " + n + "</span>").join("");
    renderTally();
    status.textContent = canVibrate ? "vibrate: available" : "vibrate: not available here";

    // ── YouTube IFrame API ───────────────────────────────────────────────
    const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.append(tag);
    window.onYouTubeIframeAPIReady = () => { ytReady = true; for (const c of deck.children) attachPlayer(c); post({ type: "info", msg: "YouTube IFrame API ready" }); };
    function attachPlayer(card) {
      if (!ytReady || players.has(card)) return;
      const host = card.querySelector(".yt");
      const p = new YT.Player(host, {
        videoId: card.dataset.video,
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 1 },
        events: { onReady: () => { if (card === cur) try { p.playVideo(); } catch {} } },
      });
      players.set(card, p);
    }
    function togglePlay(card) {
      const p = players.get(card); if (!p || !p.getPlayerState) return;
      try { p.getPlayerState() === YT.PlayerState.PLAYING ? p.pauseVideo() : p.playVideo(); } catch {}
    }
    function pause(card) { const p = players.get(card); try { p && p.pauseVideo && p.pauseVideo(); } catch {} }

    // ── cards ────────────────────────────────────────────────────────────
    function makeCard(i) {
      const id = VIDEOS[((i % VIDEOS.length) + VIDEOS.length) % VIDEOS.length];
      const el = document.createElement("div");
      el.className = "card"; el.dataset.video = id; el.dataset.index = i;
      el.innerHTML =
        "<div class=\"video\"><div class=\"yt\"></div><div class=\"overlay\"></div>" +
        "<span class=\"stamp again\">AGAIN</span><span class=\"stamp hard\">HARD</span><span class=\"stamp good\">GOOD</span><span class=\"stamp easy\">EASY</span>" +
        "<span class=\"stamp next\">NEXT</span><span class=\"stamp undo\">UNDO</span></div>" +
        "<div class=\"cap\"><span>#" + (i + 1) + " <b>" + id + "</b></span><span>tap: play/pause</span></div>";
      el.classList.toggle("free", free);
      return el;
    }
    function mount(i) {
      deck.replaceChildren();
      cur = makeCard(i); under = makeCard(i + 1); under.classList.add("under");
      deck.append(under, cur);
      attachPlayer(cur); attachPlayer(under);
    }
    mount(index);

    function advance(action, grade, input) {
      // grade: "again"... for a horizontal swipe, null for a skip
      const vib = vibrate(grade ? GRADES[grade].pattern : NAV.next.pattern);
      if (grade) { tally[grade]++; renderTally(); }
      history.push({ index, grade });
      if (grade) post({ type: "grade", grade, input, pattern: GRADES[grade].pattern, vibrated: vib, dx: lastDx });
      else post({ type: "nav", action: "next", input, index: index + 1, vibrated: vib });
      const gone = cur; pause(gone);
      const [fx, fy] = grade ? [(grade === "again" || grade === "hard") ? -720 : 720, 0] : [0, -820];
      gone.classList.add("fly"); gone.style.transform = "translate(" + fx + "px, " + fy + "px) rotate(" + fx / 16 + "deg)";
      const done = () => { gone.remove(); players.get(gone)?.destroy?.(); players.delete(gone); };
      gone.addEventListener("transitionend", done, { once: true }); setTimeout(done, 450);
      index++;
      cur = under; cur.classList.remove("under"); players.get(cur)?.playVideo?.();
      under = makeCard(index + 1); under.classList.add("under"); deck.prepend(under); attachPlayer(under);
      clearMeter();
    }
    function undo(input) {
      const last = history.pop();
      const vib = vibrate(NAV.undo.pattern);
      if (!last) { post({ type: "nav", action: "undo", input, index, vibrated: vib }); snapBack(); post({ type: "info", msg: "nothing to undo" }); return; }
      if (last.grade) { tally[last.grade]--; renderTally(); }
      pause(cur);
      index = last.index;
      post({ type: "nav", action: "undo", input, index, vibrated: vib });
      for (const c of deck.children) { players.get(c)?.destroy?.(); players.delete(c); }
      mount(index);
      clearMeter();
    }

    // ── meter + stamps ───────────────────────────────────────────────────
    let lastZone = null, lastDx = 0;
    function paint(dx, dy, axis) {
      const s = Object.fromEntries([...cur.querySelectorAll(".stamp")].map((e) => [e.classList[1], e]));
      for (const k in s) s[k].style.opacity = 0;
      if (axis === "x") {
        lastDx = dx;
        cur.style.transform = "translateX(" + dx + "px) rotate(" + dx / 22 + "deg)";
        const z = zoneFor(dx);
        marker.style.left = (50 + Math.max(-50, Math.min(50, (dx / (FAR * 1.4)) * 50))) + "%";
        marker.style.opacity = 1;
        for (const el of meter.querySelectorAll("span")) el.classList.toggle("lit", el.dataset.z === z);
        if (z) s[z].style.opacity = Math.min(1, (Math.abs(dx) - DEAD) / 40 + .4);
        if (z !== lastZone) { const t = z ? vibrate(TICK) : false; if (z) post({ type: "tick", zone: z, vibrated: t }); lastZone = z; }
      } else {
        cur.style.transform = "translateY(" + dy + "px)";
        const k = dy < 0 ? "next" : "undo";
        if (Math.abs(dy) >= DEAD) s[k].style.opacity = Math.min(1, (Math.abs(dy) - DEAD) / 40 + .4);
      }
    }
    function clearMeter() {
      marker.style.left = "50%"; marker.style.opacity = .5; lastZone = null;
      for (const el of meter.querySelectorAll("span")) el.classList.remove("lit");
    }
    function snapBack() {
      cur.classList.add("snap"); cur.style.transform = "";
      for (const e of cur.querySelectorAll(".stamp")) e.style.opacity = 0;
      cur.addEventListener("transitionend", () => cur.classList.remove("snap"), { once: true });
      clearMeter();
    }

    // ── gesture (pointer events; the overlay owns the video area) ────────
    let drag = null;
    deck.addEventListener("pointerdown", (e) => {
      if (!cur || !cur.contains(e.target)) return;
      drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, axis: null };
      deck.setPointerCapture(e.pointerId); cur.classList.remove("snap");
    });
    deck.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      drag.dx = e.clientX - drag.x0; drag.dy = e.clientY - drag.y0;
      if (!drag.axis && Math.hypot(drag.dx, drag.dy) > 10) drag.axis = Math.abs(drag.dx) >= Math.abs(drag.dy) ? "x" : "y";
      if (drag.axis) paint(drag.dx, drag.dy, drag.axis);
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const { dx, dy, axis } = drag; drag = null;
      if (!axis) { togglePlay(cur); return; }                                  // tap
      if (axis === "x") { const z = zoneFor(dx); z ? advance("grade", z, "swipe " + Math.round(dx) + "px") : snapBack(); return; }
      if (dy <= -DEAD * 2) advance("next", null, "swipe up");
      else if (dy >= DEAD * 2) undo("swipe down");
      else snapBack();
    };
    deck.addEventListener("pointerup", end);
    deck.addEventListener("pointercancel", end);

    freeBtn.addEventListener("click", () => {
      free = !free; freeBtn.setAttribute("aria-pressed", String(free));
      for (const c of deck.children) c.classList.toggle("free", free);
      post({ type: "info", msg: free ? "YouTube controls reachable; swipe from the caption strip" : "overlay owns the video; tap = play/pause" });
    });

    // Desktop path: 1-4 grade, W next, S undo, space play/pause.
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (KEYS[k]) { lastDx = 0; advance("grade", KEYS[k], "key " + k); }
      else if (k === "w") advance("next", null, "key w");
      else if (k === "s") undo("key s");
      else if (k === " ") { e.preventDefault(); togglePlay(cur); }
    });
    window.addEventListener("pointerdown", () => window.focus(), { once: true });
    post({ type: "info", msg: canVibrate ? "iframe: Vibration API present" : "iframe: Vibration API absent" });
  </script>
</body>
</html>
